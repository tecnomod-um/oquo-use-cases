# OntoPortal appliance with O'FAIRe (ontoportal/README.md): the docker-compose.yml
# of the ontoportal_docker submodule plus the changes in compose.override.yml
include:
  - path:
      - ontoportal/ontoportal_docker/docker-compose.yml
      - ontoportal/compose.override.yml
    project_directory: ontoportal/ontoportal_docker
    env_file: ontoportal/ontoportal.env

services:
  oquo-instance-creator:
    build: ./oquo-instance-creator-endpoint
    ports:
      - "${OQUO_INSTANCE_CREATOR_PORT}:8000"

  foops-to-oquo-converter:
    build: ./foops-to-oquo-converter
    ports:
      - "${FOOPS_TO_OQUO_CONVERTER_PORT}:8001"
    environment:
      OQUO_INSTANCE_CREATOR_URL: http://oquo-instance-creator:8000/toOquoObservation
    depends_on:
      - oquo-instance-creator
    
  foops:
    build: ./foops
    ports:
      - "${FOOPS_PORT}:8002"
