# Changes to the OntoPortal appliance of ontoportal_docker, included together
# with its docker-compose.yml from services/docker-compose.yml.
#
# Relative paths are resolved against the project directory of the include,
# ontoportal/ontoportal_docker. Variables come from ontoportal/ontoportal.env.
#
#   - ncbo_cron loads the ontologies described in ONTOPORTAL_DATA_DIR (from a
#     local file or from their pullLocation) before running the cron
#     (provision.sh), and is healthy once they are loaded
#   - O'FAIRe is built at a fixed commit and starts after the provisioning
#   - the web UI and its databases are only started with '--profile ui'
#   - api and ncbo_cron read ontoportal.env instead of ontoportal_docker/.env

services:
  ncbo_cron:
    env_file: !override
      - ../ontoportal.env
    command: ["/usr/local/bin/oquo-provision.sh", "bundle", "exec", "bin/ncbo_cron"]
    volumes:
      - ../provision.sh:/usr/local/bin/oquo-provision.sh:ro
      # descriptions of the ontologies to load (read by provision.sh)
      - ${ONTOPORTAL_DATA_DIR}:/srv/ontoportal/data/ontologies-src:ro
      # replaces the mount of ./data/ontologies (same target): provision.sh
      # writes there the JSON and the file that bin/ncbo_ontology_load reads
      - ontoportal_ontologies:/srv/ontoportal/data/ontologies
    healthcheck:
      test: ["CMD-SHELL", "test -f /srv/ontoportal/data/repository/.oquo-provisioning/ready"]
      # loading and processing an ontology can take several minutes
      start_period: 60m
      start_interval: 10s
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    env_file: !override
      - ../ontoportal.env

  fairness:
    build:
      dockerfile: ../../../fairness.Dockerfile
      args:
        FAIRNESS_COMMIT: ${FAIRNESS_COMMIT}
    depends_on:
      ncbo_cron:
        condition: service_healthy

  ui:
    profiles: ["ui"]
    env_file: !override
      - ../ontoportal.env
  db:
    profiles: ["ui"]
  cache:
    profiles: ["ui"]

volumes:
  # ontologies prepared by provision.sh for bin/ncbo_ontology_load
  ontoportal_ontologies:
